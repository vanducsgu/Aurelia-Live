name: Build Aurelia Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Build and test Android
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            apk=$(find android/app/build/outputs/apk/debug -name "*${abi}*debug.apk" -print -quit)
            test -n "$apk"
            cp "$apk" "dist/Aurelia-Live-0.3.0-preview-${abi}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Aurelia-Live-0.3.0-preview-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
